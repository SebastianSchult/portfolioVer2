<nav>
  <div class="nav-box" id="nav">
    <div>
      <a href="" class="logo"
        >Sebast<span class="dot">i</span>a<span class="styled-n"
          ><span class="left-n">n</span><span class="right-n">n</span></span
        ></a
      >
    </div>
    <div class="navbar-links">
      <a href="#about-me" class="navbar-link">{{ 'ABOUTME' | translate}}</a>
      <a href="#skills" class="navbar-link">{{ 'SKILLS' | translate}}</a>
      <a href="#portfolio-section" class="navbar-link">Portfolio</a>

      <div class="lang-box">
        <button
          type="button"
          class="lang-btn"
          [attr.aria-label]="'SWITCH_TO_EN' | translate"
          (click)="changeLanguage('en')"
        >
          <img class="lang-img" src="assets/img/language/flag_great_britain.png" alt="" />
        </button>
        <button
          type="button"
          class="lang-btn"
          [attr.aria-label]="'SWITCH_TO_DE' | translate"
          (click)="changeLanguage('de')"
        >
          <img class="lang-img" src="assets/img/language/flag_germany.webp" alt="" />
        </button>
      </div>
    </div>

    <div class="burger-menu-responsive">
      <button
        #burgerBtn
        type="button"
        class="openBurger"
        (click)="openResponsiveMenu()"
        [attr.aria-expanded]="showResponsiveMenu"
        [attr.aria-label]="(showResponsiveMenu ? 'CLOSEMENU' : 'OPENMENU') | translate"
      >
        <img src="./assets/img/header/34. burger menu.png" alt="" />
      </button>
    </div>
  </div>
  <div
    class="overlay"
    *ngIf="showResponsiveMenu"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'MOBILENAV' | translate"
  >
    <div class="burger-con">
      <a #firstMenuLink href="#about-me" (click)="closeResponsiveMenu()">About me</a>
      <a href="#skills-headliner" (click)="closeResponsiveMenu()">Skills</a>
      <a href="#portfolio-section" (click)="closeResponsiveMenu()">Portfolio</a>
      <a href="#contact" (click)="closeResponsiveMenu()">Contact</a>
    </div>
  </div>
</nav>
